name: Rebuild lorik-os.svg

on:
  push:
    paths:
      - 'data/**'
      - 'about.txt'
      - 'scripts/build-svg.js'
  repository_dispatch:
    types: [repo_pushed]   # triggered by other repos when you push to them
  schedule:
    - cron: '0 6 * * *'   # daily fallback at 06:00 UTC
  workflow_dispatch:       # manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-svg.js

      - name: Commit updated SVG
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lorik-os.svg
          git diff --cached --quiet || git commit -m "auto: rebuild lorik-os.svg [skip ci]"
          git push
