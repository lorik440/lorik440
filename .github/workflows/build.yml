name: Rebuild lorik-os.svg

on:
  push:
    paths:
      # rebuild whenever you edit any of these files
      - 'data/**'
      - 'about.txt'
      - 'scripts/build-svg.js'
  schedule:
    # also rebuild every day at 06:00 UTC so stats stay fresh
    - cron: '0 6 * * *'
  workflow_dispatch:
    # lets you trigger a manual rebuild from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit lorik-os.svg back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-svg.js

      - name: Commit updated SVG
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lorik-os.svg
          git diff --cached --quiet || git commit -m "auto: rebuild lorik-os.svg [skip ci]"
          git push
