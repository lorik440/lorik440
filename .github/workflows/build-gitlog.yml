name: Build git log

# Refresh the git log section using the GitHub API,
# update data/commits.json, rebuild lorik-os.svg,
# and commit only when files have changed.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevent simultaneous SVG builds from conflicting.
concurrency:
  group: build-svg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-gitlog.js

      - name: Rebuild SVG
        run: node scripts/build-svg.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/commits.json lorik-os.svg

          if ! git diff --cached --quiet; then
            git commit -m "auto: refresh git log [skip ci]"
            git push
          else
            echo "No changes detected. Nothing to commit."
          fi


