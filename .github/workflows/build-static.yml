name: Build static SVG

# Rebuild lorik-os.svg when a hand-edited data file or the build script changes.
# Triggered by your own pushes (not by the bot's data commits, which use
# GITHUB_TOKEN and don't fire workflow runs).
on:
  push:
    paths:
      - 'data/identity.json'
      - 'data/projects.json'
      - 'data/skills.json'
      - 'about.txt'
      - 'scripts/build-svg.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-svg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild SVG
        run: node scripts/build-svg.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lorik-os.svg
          git diff --cached --quiet || git commit -m "auto: rebuild lorik-os.svg [skip ci]"
          git push
