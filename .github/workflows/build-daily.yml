name: Build daily stats

# Refresh the slow-moving sections once a day: fetch user/repos via the GitHub
# API, update data/gh-stats.json, rebuild lorik-os.svg, commit only if changed.
on:
  schedule:
    - cron: '0 6 * * *'      # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-svg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-gh-stats.js

      - name: Rebuild SVG
        run: node scripts/build-svg.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gh-stats.json lorik-os.svg
          git diff --cached --quiet || git commit -m "auto: refresh github stats [skip ci]"
          git push
