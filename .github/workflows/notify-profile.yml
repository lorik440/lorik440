name: Notify profile on push

# This file lives in your OTHER repos (Code.HP, DockApp, etc.)
# Copy it to .github/workflows/notify-profile.yml in each one.
# It fires whenever you push, and tells your profile repo to rebuild the SVG.
#
# Required secret in each repo:
#   PROFILE_REBUILD_TOKEN  — a GitHub PAT with repo scope (see README)

on:
  push:
    branches: ['**']   # any branch

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger profile rebuild
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROFILE_REBUILD_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'lorik440',
              repo:  'lorik440',
              event_type: 'repo_pushed',
              client_payload: {
                source_repo: context.repo.repo,
                ref: context.ref
              }
            });
            console.log(`Dispatched rebuild from ${context.repo.repo}`);
