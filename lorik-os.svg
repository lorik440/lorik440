  <text x="28" y="650" font-size="11" fill="#1a4a2e" letter-spacing="2">// system.stats ──────────────────────────────────────────────────────────────────────────────────</text>
  <line x1="0" y1="660" x2="900" y2="660" stroke="#0d2a1a" stroke-width="1"/>

