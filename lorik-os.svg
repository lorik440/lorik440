<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 980" width="900" height="980"
     role="img" aria-label="lorik440 — terminal profile">
  <title>lorik440</title>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      text {
        font-family: 'JetBrains Mono','Cascadia Code','Fira Code',ui-monospace,Menlo,monospace;
      }
    </style>
    <!-- lang bar clip paths -->
    <clipPath id="py-clip"><rect x="28" y="0" width="504" height="14" rx="3"/></clipPath>
