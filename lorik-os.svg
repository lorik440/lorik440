  <!-- ── full canvas background ── -->
  <rect width="900" height="980" fill="#030806"/>

  <!-- ════════════════════════════════════════════════════
       TERMINAL SESSION
  ════════════════════════════════════════════════════ -->

  <!-- whoami -->
  <text x="28" y="44"  font-size="13" fill="#3AA374">lorik@lorik-os:~$  <tspan fill="#8EFFC6">whoami</tspan></text>
  <text x="28" y="68"  font-size="15" font-weight="700" fill="#27FF9C">lorik Bajrami</text>
  <text x="28" y="90"  font-size="13" fill="#6DEBAA">software dev  ·  python, javascript, c#</text>

  <!-- ls projects/ -->
  <text x="28" y="128" font-size="13" fill="#3AA374">lorik@lorik-os:~$  <tspan fill="#8EFFC6">ls projects/</tspan></text>
  <text x="28" y="152" font-size="13" fill="#8EFFC6">Code.HP        <tspan fill="#6DEBAA">js    </tspan><tspan fill="#C8FFE0">snippet manager — stores and searches your code</tspan></text>
  <text x="28" y="174" font-size="13" fill="#8EFFC6">DockApp        <tspan fill="#6DEBAA">c#    </tspan><tspan fill="#C8FFE0">windows launcher that adapts to how you work</tspan></text>
  <text x="28" y="196" font-size="13" fill="#8EFFC6">TorchFoundry   <tspan fill="#6DEBAA">py    </tspan><tspan fill="#C8FFE0">pytorch utilities for cleaner ml workflows</tspan></text>
  <text x="28" y="218" font-size="13" fill="#8EFFC6">GestureNet     <tspan fill="#6DEBAA">py    </tspan><tspan fill="#C8FFE0">gesture recognition with computer vision</tspan></text>

  <!-- cat about.txt -->
  <text x="28" y="254" font-size="13" fill="#3AA374">lorik@lorik-os:~$  <tspan fill="#8EFFC6">cat about.txt</tspan></text>
  <text x="28" y="278" font-size="13" fill="#C8FFE0">i like building things that actually run.</text>
  <text x="28" y="300" font-size="13" fill="#C8FFE0">mostly desktop tools and ml stuff.</text>
  <text x="28" y="322" font-size="13" fill="#6DEBAA">still figuring it out  —  git push anyway.</text>

  <!-- cat skills.txt -->
  <text x="28" y="358" font-size="13" fill="#3AA374">lorik@lorik-os:~$  <tspan fill="#8EFFC6">cat skills.txt</tspan></text>
  <text x="28" y="382" font-size="13" fill="#6DEBAA">languages  <tspan fill="#C8FFE0">python  javascript  c#  sql</tspan></text>
  <text x="28" y="404" font-size="13" fill="#6DEBAA">backend    <tspan fill="#C8FFE0">fastapi</tspan></text>
  <text x="28" y="426" font-size="13" fill="#6DEBAA">database   <tspan fill="#C8FFE0">sql server  supabase</tspan></text>
  <text x="28" y="448" font-size="13" fill="#6DEBAA">ml         <tspan fill="#C8FFE0">pytorch  computer vision</tspan></text>
  <text x="28" y="470" font-size="13" fill="#6DEBAA">env        <tspan fill="#C8FFE0">windows  linux  git</tspan></text>

  <!-- git log -->
  <text x="28" y="506" font-size="13" fill="#3AA374">lorik@lorik-os:~$  <tspan fill="#8EFFC6">git log --oneline -3</tspan></text>
  <text x="28" y="530" font-size="13" fill="#6DEBAA">a3f9c12  <tspan fill="#C8FFE0">add torchfoundry utilities</tspan></text>
  <text x="28" y="552" font-size="13" fill="#6DEBAA">7b2e881  <tspan fill="#C8FFE0">dockapp: fix launcher priority logic</tspan></text>
  <text x="28" y="574" font-size="13" fill="#6DEBAA">c91d440  <tspan fill="#C8FFE0">code.hp: instant search on keystroke</tspan></text>

  <!-- live prompt + blink -->
  <text x="28" y="608" font-size="13" fill="#3AA374">lorik@lorik-os:~$</text>
  <rect x="198" y="594" width="9" height="15" fill="#27FF9C">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

