  ════════════════════════════════════════════════════ -->

  <text x="348" y="690" font-size="11" fill="#3AA374" letter-spacing="1">TOP LANGUAGES</text>

  <!-- Python bar — 50% of 504px = 252px -->
  <text x="348" y="716" font-size="12" fill="#6DEBAA">Python        <tspan fill="#C8FFE0">50%</tspan></text>
  <rect x="348" y="722" width="504" height="10" rx="3" fill="#07120D"/>
  <rect x="348" y="722" width="252" height="10" rx="3" fill="#27FF9C"/>

  <!-- JavaScript bar — 25% = 126px -->
  <text x="348" y="754" font-size="12" fill="#6DEBAA">JavaScript    <tspan fill="#C8FFE0">25%</tspan></text>
  <rect x="348" y="760" width="504" height="10" rx="3" fill="#07120D"/>
  <rect x="348" y="760" width="126" height="10" rx="3" fill="#4FDC91"/>

  <!-- C# bar — 25% = 126px -->
  <text x="348" y="792" font-size="12" fill="#6DEBAA">C#            <tspan fill="#C8FFE0">25%</tspan></text>
  <rect x="348" y="798" width="504" height="10" rx="3" fill="#07120D"/>
  <rect x="348" y="798" width="126" height="10" rx="3" fill="#6DEBAA"/>

