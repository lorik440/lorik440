  <text x="28" y="888" font-size="11" fill="#1a4a2e" letter-spacing="2">// system.streak ─────────────────────────────────────────────────────────────────────────────────</text>
  <line x1="0" y1="898" x2="900" y2="898" stroke="#0d2a1a" stroke-width="1"/>

