  <text x="28"  y="716" font-size="13" fill="#6DEBAA">repos        <tspan fill="#C8FFE0">5</tspan></text>
  <text x="28"  y="738" font-size="13" fill="#6DEBAA">stars        <tspan fill="#C8FFE0">2</tspan></text>
  <text x="28"  y="760" font-size="13" fill="#6DEBAA">followers    <tspan fill="#C8FFE0">2</tspan></text>
  <text x="28"  y="782" font-size="13" fill="#6DEBAA">following    <tspan fill="#C8FFE0">4</tspan></text>
  <text x="28"  y="804" font-size="13" fill="#6DEBAA">member since <tspan fill="#C8FFE0">2025.06</tspan></text>
  <text x="28"  y="826" font-size="13" fill="#6DEBAA">status       <tspan fill="#27FF9C">●</tspan><tspan fill="#C8FFE0"> online</tspan></text>

  <!-- vertical separator -->
  <line x1="320" y1="668" x2="320" y2="870" stroke="#0d2a1a" stroke-width="1"/>

