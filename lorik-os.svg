  ════════════════════════════════════════════════════ -->

  <!-- current streak -->
  <text x="150" y="932" font-size="11" fill="#6DEBAA" text-anchor="middle" letter-spacing="1">CURRENT STREAK</text>
  <text x="150" y="960" font-size="28" font-weight="700" fill="#27FF9C" text-anchor="middle">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    2
  </text>
