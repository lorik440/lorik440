  <text x="450" y="960" font-size="28" font-weight="700" fill="#4FDC91" text-anchor="middle">2</text>
  <text x="450" y="978" font-size="11" fill="#3AA374" text-anchor="middle">days</text>

  <!-- divider -->
  <line x1="600" y1="910" x2="600" y2="980" stroke="#0d2a1a" stroke-width="1"/>

  <!-- total repos -->
  <text x="750" y="932" font-size="11" fill="#6DEBAA" text-anchor="middle" letter-spacing="1">TOTAL REPOS</text>
  <text x="750" y="960" font-size="28" font-weight="700" fill="#8EFFC6" text-anchor="middle">5</text>
  <text x="750" y="978" font-size="11" fill="#3AA374" text-anchor="middle">public</text>

